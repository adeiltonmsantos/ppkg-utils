{% extends "global/pages/base.html" %}

{% block content %}

<div class="form-container">
    <h2>ACESSO AO SISTEMA</h2>
    <form method="post">
        {% csrf_token %}
        <div class="fields-container">
            {% if form.errors %}
                <div class="form-controls">
                    <div class="error-message-form">
                        Usuário/senha incorretos. Tente novamente.
                    </div>
                </div>
            {% endif %}
            <div class="form-field-row form-field-login">
                <div class="form-field-collumn">
                    {{form.username.label_tag}}
                    {{ form.username}}
                </div>
                <div class="form-field-collumn">
                    {{form.password.label_tag}}
                    {{ form.password}}
                </div>
            </div>
            <div class="form-controls">
                <button type="submit" class="form-btn">Ok</button>
                <button type="reset" class="form-btn">Cancelar</button>
            </div>
        </div>
    </form>
</div>

{% endblock content %}
